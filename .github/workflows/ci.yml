name: Verify UTR
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: utr_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: utr_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://utr_test@localhost:5432/utr_test
      DATABASE_URL: postgresql://utr_test@localhost:5432/utr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db-bootstrap.sql
      - run: node scripts/migrate.mjs
      - run: npm test
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
